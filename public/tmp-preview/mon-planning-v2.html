<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mon planning v2 — preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070B18; --card: #0F1428; --border: #1C2443; --border2: #222B4D;
      --text: #F2F4FA; --muted: #9AA3BD; --tertiary: #6C7593;
      --school: #6E5BFF; --school-light: #C9C2FF; --company: #5EDCC3;
      --holiday: #2A3150; --exam: #F2CF6B;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Manrope, system-ui, sans-serif; background: var(--bg); color: var(--text);
      padding: 28px 24px 80px;
    }
    h1 { font-size: 38px; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
    .sub { color: var(--muted); font-size: 14px; margin-top: 8px; max-width: 720px; }
    .top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    .btn {
      height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--border2);
      background: transparent; color: var(--text); font: 600 13px Manrope; cursor: pointer;
    }
    .banner {
      margin-top: 24px; border-radius: 28px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr;
    }
    .banner.company { background: radial-gradient(120% 160% at 0% 0%, #0F4A44 0%, #10233A 50%, #0F1428 100%); }
    .banner.school { background: radial-gradient(120% 160% at 0% 0%, #2A2270 0%, #10233A 50%, #0F1428 100%); }
    .banner.holiday { background: radial-gradient(120% 160% at 0% 0%, #2A3150 0%, #10233A 50%, #0F1428 100%); }
    .banner.before { background: radial-gradient(120% 160% at 0% 0%, #2A2270 0%, #10233A 50%, #0F1428 100%); }
    .banner > div { padding: 32px; }
    .banner > div:first-child { border-right: 1px solid rgba(255,255,255,.1); }
    .eyebrow { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
    .banner h2 { font-size: 30px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
    .banner p { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
    .right-title { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
    .right-line { font-size: 22px; font-weight: 700; margin: 0; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 24px; margin-top: 20px; }
    .card-h { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    .card-h h3 { margin: 0; font-size: 16px; font-weight: 800; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--tertiary); font-size: 11.5px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .sq { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    .frise { display: flex; gap: 4px; align-items: flex-end; overflow-x: auto; padding-bottom: 4px; }
    .frise button {
      flex: 1; min-width: 10px; border: 0; border-radius: 5px; height: 22px; cursor: pointer; padding: 0;
    }
    .frise button.current { height: 30px; box-shadow: 0 0 0 2px #fff; }
    .months { display: flex; margin-top: 8px; color: var(--tertiary); font-size: 11.5px; }
    .months div { text-align: center; }
    .grid { display: grid; grid-template-columns: minmax(0,1fr) 360px; gap: 20px; margin-top: 20px; }
    .week-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .round {
      width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--border2);
      background: transparent; color: var(--text); font-size: 18px;
    }
    .week-title { text-align: center; font-size: 16px; font-weight: 800; margin: 0; }
    .week-sub { text-align: center; color: var(--school-light); font-size: 13px; font-weight: 600; margin: 6px 0 0; }
    .row {
      display: flex; gap: 12px; border-radius: 18px; padding: 12px 16px; margin-top: 8px; border: 1px solid transparent;
    }
    .row.hi { background: #141B36; border-color: #2E3570; }
    .day { width: 72px; font-size: 24px; font-weight: 800; line-height: 1; flex-shrink: 0; }
    .bar { width: 4px; border-radius: 999px; flex-shrink: 0; }
    .title { font-size: 15.5px; font-weight: 800; margin: 0; }
    .meta { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
    .hint { color: var(--tertiary); font-size: 12.5px; font-style: italic; margin: 4px 0 0; }
    .pill {
      margin-left: auto; align-self: flex-start; border-radius: 999px; padding: 4px 12px;
      font-size: 11px; font-weight: 600; flex-shrink: 0;
    }
    .upcoming { display: flex; gap: 12px; margin-top: 12px; }
    .datebox {
      width: 46px; height: 50px; border-radius: 12px; border: 1px solid var(--border2);
      background: #141B36; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .datebox small { color: var(--tertiary); font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .datebox b { font-size: 18px; line-height: 1; }
    .dot { width: 6px; height: 6px; border-radius: 999px; display: inline-block; margin-right: 8px; }
    .white-btn {
      margin-top: 16px; height: 44px; width: 100%; border-radius: 999px; border: 0; background: #fff;
      color: #070B18; font: 800 13px Manrope;
    }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .tabs a {
      color: var(--muted); text-decoration: none; border: 1px solid var(--border2); border-radius: 999px;
      padding: 8px 14px; font-size: 12px; font-weight: 600;
    }
    .tabs a.on { background: #fff; color: #070B18; }
    .empty { color: var(--tertiary); font-size: 13px; padding: 8px 0; }
    @media (max-width: 900px) {
      .banner { grid-template-columns: 1fr; }
      .banner > div:first-child { border-right: 0; border-bottom: 1px solid rgba(255,255,255,.1); }
      .grid { grid-template-columns: 1fr; }
      body.mobile-preview { max-width: 390px; margin: 0 auto; padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="tabs" id="tabs"></div>
  <div id="app"></div>
  <script>
    const DATA = {
      subtitle: "Titre pro NTC · Business Sport · année 2026-2027 · 1 semaine à l'école, 3 semaines en entreprise",
      company: "Les Sports Normands, Caen",
      tutor: "Claire Duval",
      campus: "Campus Byound, Caen",
      weeks: [],
      schoolDays: [
        { day: "lun. 23", title: "Négociation : préparer un rendez-vous", meta: "9 h – 12 h · Campus Byound, Caen", hint: "apporte ton dossier entreprise", pill: "École", color: "#6E5BFF", hi: false },
        { day: "mar. 24", title: "Relation client sport", meta: "9 h – 12 h · Campus Byound, Caen", pill: "École", color: "#6E5BFF", hi: false },
        { day: "mer. 25", title: "Atelier terrain", meta: "9 h – 12 h · Campus Byound, Caen", pill: "Projet", color: "#6E5BFF", hi: false },
        { day: "jeu. 26", title: "Évaluation : étude de cas", meta: "9 h – 12 h · Campus Byound, Caen", pill: "Évaluation", color: "#F2CF6B", hi: true },
        { day: "ven. 27", title: "Point référent", meta: "9 h – 12 h · Campus Byound, Caen", pill: "Référent", color: "#6E5BFF", hi: false },
      ],
      upcoming: [
        { mon: "nov.", day: "26", title: "Évaluation : étude de cas", color: "#F2CF6B" },
        { mon: "déc.", day: "4", title: "Livret d'apprentissage", color: "#5EDCC3" },
        { mon: "déc.", day: "21", title: "Vacances de Noël", color: "#6C7593" },
      ],
    };

    // Build frise from live pattern: Sept 7 2026 to Jul 3 2027 with overrides
    (function buildWeeks() {
      const start = new Date("2026-09-07T12:00:00");
      const end = new Date("2027-07-03T12:00:00");
      const overrides = { "2026-11-16": "company", "2026-11-23": "school", "2026-12-21": "holiday", "2026-12-28": "holiday" };
      let i = 0;
      for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 7), i++) {
        const key = d.toISOString().slice(0, 10);
        let type = (i % 4 === 0) ? "school" : "company";
        if (key >= "2026-12-21" && key <= "2027-01-04") type = "holiday";
        if (overrides[key]) type = overrides[key];
        DATA.weeks.push({ key, type, current: key === "2026-11-16" });
      }
    })();

    const COLORS = { school: "#6E5BFF", company: "#5EDCC3", holiday: "#2A3150", exam: "#F2CF6B" };
    const LABELS = { school: "École", company: "Entreprise", holiday: "Vacances", exam: "Examens" };

    const STATES = {
      company: {
        label: "Entreprise",
        bannerClass: "company",
        leftEyebrow: "Cette semaine · 16 au 20 nov.",
        leftTitle: "Tu es en entreprise",
        leftSub: DATA.company + " · tuteur : " + DATA.tutor,
        rightTitle: "Retour à l'école",
        rightLine: "Lundi 23 nov. · 9 h",
        rightSub: DATA.campus + " · dans 2 jours",
        weekLabel: "Semaine en entreprise",
        weekRange: "Semaine du 16 au 20 nov.",
        detail: "company",
      },
      school: {
        label: "École",
        bannerClass: "school",
        leftEyebrow: "Cette semaine · 23 au 27 nov.",
        leftTitle: "Tu es à l'école",
        leftSub: DATA.campus + " · premier cours lundi à 9 h",
        rightTitle: "Retour en entreprise",
        rightLine: "Lundi 30 nov.",
        rightSub: null,
        weekLabel: "Semaine à l'école",
        weekRange: "Semaine du 23 au 27 nov.",
        detail: "school",
      },
      holiday: {
        label: "Vacances",
        bannerClass: "holiday",
        leftEyebrow: "Cette semaine · 21 au 25 déc.",
        leftTitle: "Tu es en vacances",
        leftSub: "Reprise à l'école le lundi 5 janv.",
        rightTitle: null,
        weekLabel: "Vacances",
        weekRange: "Semaine du 21 au 25 déc.",
        detail: "holiday",
      },
      before: {
        label: "Avant l'année",
        bannerClass: "before",
        leftEyebrow: null,
        leftTitle: "Ton année commence le lundi 7 sept.",
        leftSub: null,
        rightTitle: null,
        weekLabel: "Hors année",
        weekRange: "Avant la rentrée",
        detail: "before",
      },
    };

    function render(stateKey, mobile) {
      document.body.classList.toggle("mobile-preview", !!mobile);
      const s = STATES[stateKey];
      const months = [];
      DATA.weeks.forEach((w) => {
        const label = new Date(w.key + "T12:00:00").toLocaleDateString("fr-FR", { month: "short" }).replace(".", "");
        const last = months[months.length - 1];
        if (last && last.label === label) last.span += 1;
        else months.push({ label, span: 1 });
      });

      let detailHtml = "";
      if (s.detail === "company") {
        detailHtml = `<div class="row"><div class="bar" style="background:var(--company)"></div><div>
          <p class="title">En entreprise du lundi au vendredi</p>
          <p class="meta">${DATA.company} · tuteur : ${DATA.tutor}</p>
        </div></div>`;
      } else if (s.detail === "holiday") {
        detailHtml = `<div class="row"><div class="bar" style="background:var(--holiday)"></div><div>
          <p class="title">Vacances</p>
          <p class="meta">Reprise le lundi 5 janv.</p>
        </div></div>`;
      } else if (s.detail === "before") {
        detailHtml = `<p class="empty">Ton année n'a pas encore commencé.</p>`;
      } else {
        detailHtml = DATA.schoolDays.map((d) => `
          <div class="row ${d.hi ? "hi" : ""}">
            <div class="day">${d.day}</div>
            <div class="bar" style="background:${d.color}"></div>
            <div style="min-width:0;flex:1">
              <p class="title">${d.title}</p>
              <p class="meta">${d.meta}</p>
              ${d.hint ? `<p class="hint">${d.hint}</p>` : ""}
            </div>
            <span class="pill" style="background:${d.color}22;color:${d.color}">${d.pill}</span>
          </div>`).join("");
      }

      document.getElementById("app").innerHTML = `
        <div class="top">
          <div>
            <h1>Mon planning</h1>
            <p class="sub">${DATA.subtitle}</p>
          </div>
          <button class="btn">⤓ Ajouter à mon agenda</button>
        </div>
        <section class="banner ${s.bannerClass}">
          <div>
            ${s.leftEyebrow ? `<p class="eyebrow">${s.leftEyebrow}</p>` : ""}
            <h2>${s.leftTitle}</h2>
            ${s.leftSub ? `<p>${s.leftSub}</p>` : ""}
          </div>
          <div>
            ${s.rightTitle ? `<p class="right-title">${s.rightTitle}</p><p class="right-line">${s.rightLine}</p>${s.rightSub ? `<p>${s.rightSub}</p>` : ""}` : ""}
          </div>
        </section>
        <section class="card">
          <div class="card-h">
            <h3>Mon année en un coup d'œil</h3>
            <div class="legend">
              ${Object.keys(LABELS).map(k => `<span><i class="sq" style="background:${COLORS[k]}"></i>${LABELS[k]}</span>`).join("")}
            </div>
          </div>
          <div class="frise">
            ${DATA.weeks.map(w => `<button class="${w.current && stateKey==='company' ? 'current' : (w.key==='2026-11-23' && stateKey==='school' ? 'current' : (w.key==='2026-12-21' && stateKey==='holiday' ? 'current' : ''))}" style="background:${COLORS[w.type]}" title="${w.key}"></button>`).join("")}
          </div>
          <div class="months">${months.map(m => `<div style="flex:${m.span}">${m.label}.</div>`).join("")}</div>
        </section>
        <div class="grid">
          <section class="card">
            <div class="week-nav">
              <button class="round">‹</button>
              <div>
                <p class="week-title">${s.weekRange}</p>
                <p class="week-sub">${s.weekLabel}${stateKey!=='company' ? " · revenir à aujourd'hui" : ""}</p>
              </div>
              <button class="round">›</button>
            </div>
            <div style="margin-top:16px">${detailHtml}</div>
          </section>
          <aside>
            <section class="card">
              <div class="card-h"><h3>À venir</h3></div>
              ${DATA.upcoming.map(u => `
                <div class="upcoming">
                  <div class="datebox"><small>${u.mon}</small><b>${u.day}</b></div>
                  <div style="padding-top:6px"><span class="dot" style="background:${u.color}"></span><strong>${u.title}</strong></div>
                </div>`).join("")}
            </section>
            <section class="card">
              <h3 style="margin:0;font-size:16px;font-weight:800">Absent ou en retard ?</h3>
              <p style="color:var(--muted);font-size:13px;line-height:1.5;margin:8px 0 0">Préviens l'école et ton entreprise en une fois. Tu pourras ajouter ton justificatif ensuite.</p>
              <button class="white-btn">Signaler une absence</button>
            </section>
          </aside>
        </div>
      `;
    }

    const params = new URLSearchParams(location.search);
    const state = params.get("state") || "company";
    const mobile = params.get("mobile") === "1";
    document.getElementById("tabs").innerHTML = Object.keys(STATES).map(k =>
      `<a class="${k===state && !mobile ? 'on' : ''}" href="?state=${k}">${STATES[k].label}</a>`
    ).join("") + `<a class="${mobile?'on':''}" href="?state=${state}&mobile=1">Mobile</a>
    <a href="/dashboard/apprenant/planning">Page live</a>`;
    render(state, mobile);
  </script>
</body>
</html>
